<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D-Ansicht Demo</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg:#f6f7f9; --panel:#ffffffee; --text:#1d2433; --muted:#6b7385; --line:#dfe3ea; --accent:#2563eb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; top:12px; left:12px; width:270px; background:var(--panel); backdrop-filter: blur(6px);
           border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:0 4px 18px #0002; z-index:2; }
  .panel h1 { font-size:15px; margin:0 0 2px; }
  .panel .sub { color:var(--muted); font-size:11.5px; margin-bottom:10px; }
  .row { margin:10px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  select, .btns button { font:inherit; }
  select { width:100%; padding:5px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .btns { display:flex; gap:4px; flex-wrap:wrap; }
  .btns button { flex:1; padding:5px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; white-space:nowrap; }
  .btns button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btns button:hover:not(.on) { background:#eef2f8; }
  input[type=range] { width:100%; }
  .legend { margin-top:4px; }
  .legend div { display:flex; align-items:center; gap:6px; font-size:12px; margin:2px 0; }
  .legend i { width:14px; height:10px; border-radius:2px; display:inline-block; }
  .card { margin-top:10px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:12px; display:none; }
  .card b { display:block; font-size:13px; margin-bottom:4px; }
  .card table { border-collapse:collapse; width:100%; }
  .card td { padding:1px 0; } .card td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .hint { color:var(--muted); font-size:11px; margin-top:10px; }
  .badge { position:absolute; right:12px; bottom:28px; z-index:2; background:#fff8e1; border:1px solid #f0d58a; color:#7a5a00;
           padding:4px 8px; border-radius:6px; font-size:11.5px; }
  .maplibregl-popup-content { padding:6px 9px; font-size:12px; }
  @media (max-width:600px) { .panel { width:auto; right:16px; left:16px; } .badge { display:none; } }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>🏢 3D-Ansicht · Prototyp</h1>
  <div class="sub">Gebäude als extrudierte Grundrisse, Höhe aus Geschossen bzw. OSM-Höhe</div>

  <div class="row">Farbmodus</div>
  <select id="modus">
    <option value="waerme">Wärmebedarf spezifisch</option>
    <option value="baujahr">Baujahrsklasse</option>
    <option value="engpass">Engpassjahr Stromnetz</option>
    <option value="quelle">Datenquelle der Höhe</option>
  </select>
  <div class="legend" id="legend"></div>

  <div class="row">Ansicht</div>
  <div class="btns">
    <button id="b2d">2D</button><button id="b3d" class="on">3D</button>
    <button id="bl" title="nach links drehen">↺</button><button id="br" title="nach rechts drehen">↻</button>
  </div>

  <div class="row">Hintergrund</div>
  <div class="btns"><button id="bgKarte" class="on">Karte</button><button id="bgSat">Satellit</button></div>

  <div class="row">Höhe überhöhen: <span id="fakt">1,0</span>×</div>
  <input type="range" id="hf" min="1" max="3" step="0.1" value="1">

  <div class="btns" style="margin-top:10px"><button id="png">📷 Bild exportieren (PNG)</button></div>

  <div class="card" id="card"></div>
  <div class="hint">Rechte Maustaste / Strg + Ziehen: neigen &amp; drehen · Klick: Gebäude auswählen</div>
</div>
<div class="badge">Demo: Grundrisse &amp; Höhen echt (OSM), Wärme/Baujahr/Engpass fiktiv</div>

const RASTER = {
  karte: { tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], attribution: '© OpenStreetMap-Mitwirkende', maxzoom: 19 },
  sat:   { tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'], attribution: 'Bilder © Esri', maxzoom: 19 },
};

const MODI = {
  waerme: {
    expr: ['interpolate', ['linear'], ['get', 'spezWaerme'], 50, '#1a9850', 90, '#a6d96a', 120, '#fee08b', 150, '#fc8d59', 190, '#d73027'],
    legend: [['#1a9850', '≤ 50 kWh/m²a'], ['#a6d96a', '90'], ['#fee08b', '120'], ['#fc8d59', '150'], ['#d73027', '≥ 190 kWh/m²a']],
  },
  baujahr: {
    expr: ['step', ['get', 'baujahr'], '#7b3294', 1919, '#c2a5cf', 1949, '#f7d8a8', 1978, '#e08214', 1995, '#5aae61', 2010, '#1b7837'],
    legend: [['#7b3294', 'vor 1919'], ['#c2a5cf', '1919–1948'], ['#f7d8a8', '1949–1977'], ['#e08214', '1978–1994'], ['#5aae61', '1995–2009'], ['#1b7837', 'ab 2010']],
  },
  engpass: {
    expr: ['case', ['==', ['get', 'engpassjahr'], 0], '#c9ced8',
           ['interpolate', ['linear'], ['get', 'engpassjahr'], 2026, '#b2182b', 2035, '#ef8a62', 2045, '#fddbc7']],
    legend: [['#b2182b', 'Engpass ab 2026'], ['#ef8a62', 'ab 2035'], ['#fddbc7', 'ab 2045'], ['#c9ced8', 'kein Engpass bis 2045']],
  },
  quelle: {
    expr: ['match', ['get', 'quelle'], 'OSM-Höhe', '#2166ac', 'Geschosse', '#67a9cf', '#f4a582'],
    legend: [['#2166ac', 'Höhe gemessen (OSM height)'], ['#67a9cf', 'aus Geschosszahl × 3 m'], ['#f4a582', 'geschätzt (keine Angabe)']],
  },
};

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      karte: { type: 'raster', tileSize: 256, ...RASTER.karte },
      sat:   { type: 'raster', tileSize: 256, ...RASTER.sat },
      geb:   { type: 'geojson', data: DATA },
    },
    layers: [
      { id: 'karte', type: 'raster', source: 'karte', paint: { 'raster-saturation': -0.6, 'raster-opacity': 0.9 } },
      { id: 'sat', type: 'raster', source: 'sat', layout: { visibility: 'none' } },
      { id: 'geb-3d', type: 'fill-extrusion', source: 'geb', paint: {
          'fill-extrusion-color': MODI.waerme.expr,
          'fill-extrusion-height': ['get', 'hoehe'],
          'fill-extrusion-base': 0,
          'fill-extrusion-opacity': 0.92,
          'fill-extrusion-vertical-gradient': true,
      } },
    ],
  },
  center: [8.4136, 49.0118], zoom: 16.2, pitch: 58, bearing: -25,
  maxPitch: 75, canvasContextAttributes: { preserveDrawingBuffer: true }, preserveDrawingBuffer: true,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

let modus = 'waerme', faktor = 1, selId = null;

function farbe() {
  // Auswahl hervorheben, sonst Farbmodus
  return ['case', ['boolean', ['feature-state', 'sel'], false], '#00e5ff',
          ['boolean', ['feature-state', 'hover'], false], '#ffffff', MODI[modus].expr];
}
function anwenden() {
  if (!map.getLayer('geb-3d')) return;
  map.setPaintProperty('geb-3d', 'fill-extrusion-color', farbe());
  map.setPaintProperty('geb-3d', 'fill-extrusion-height', ['*', ['get', 'hoehe'], faktor]);
  document.getElementById('legend').innerHTML =
    MODI[modus].legend.map(([c, t]) => `<div><i style="background:${c}"></i>${t}</div>`).join('');
}

map.on('load', () => {
  map.setLight({ anchor: 'map', position: [1.3, 210, 35], intensity: 0.45 });
  anwenden();
});

// Hover + Tooltip
const pop = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
let hoverId = null;
map.on('mousemove', 'geb-3d', e => {
  const f = e.features[0];
  if (hoverId !== null && hoverId !== f.id) map.setFeatureState({ source: 'geb', id: hoverId }, { hover: false });
  hoverId = f.id; map.setFeatureState({ source: 'geb', id: hoverId }, { hover: true });
  map.getCanvas().style.cursor = 'pointer';
  pop.setLngLat(e.lngLat).setHTML(`<b>${f.properties.name}</b><br>${f.properties.hoehe} m · ${f.properties.geschosse} Geschosse`).addTo(map);
});
map.on('mouseleave', 'geb-3d', () => {
  if (hoverId !== null) map.setFeatureState({ source: 'geb', id: hoverId }, { hover: false });
  hoverId = null; map.getCanvas().style.cursor = ''; pop.remove();
});

// Klick = Auswahl (im Tool: Gebäude im Inspector öffnen)
map.on('click', e => {
  const f = map.queryRenderedFeatures(e.point, { layers: ['geb-3d'] })[0];
  if (selId !== null) map.setFeatureState({ source: 'geb', id: selId }, { sel: false });
  const card = document.getElementById('card');
  if (!f) { selId = null; card.style.display = 'none'; return; }
  selId = f.id; map.setFeatureState({ source: 'geb', id: selId }, { sel: true });
  const p = f.properties;
  card.innerHTML = `<b>${p.name}</b><table>
    <tr><td>Nutzung (OSM)</td><td>${p.nutzung}</td></tr>
    <tr><td>Höhe</td><td>${p.hoehe} m</td></tr>
    <tr><td>Geschosse</td><td>${p.geschosse}</td></tr>
    <tr><td>Höhenquelle</td><td>${p.quelle}</td></tr>
    <tr><td>Baujahr*</td><td>${p.baujahr}</td></tr>
    <tr><td>Wärme spez.*</td><td>${p.spezWaerme} kWh/m²a</td></tr>
    <tr><td>Engpassjahr*</td><td>${p.engpassjahr || '–'}</td></tr></table>
    <div style="color:#6b7385;font-size:10.5px;margin-top:4px">* Demowerte</div>`;
  card.style.display = 'block';
});

// Bedienung
const $ = id => document.getElementById(id);
$('modus').onchange = e => { modus = e.target.value; anwenden(); };
$('hf').oninput = e => { faktor = +e.target.value; $('fakt').textContent = faktor.toFixed(1).replace('.', ','); anwenden(); };
function an(btnOn, btnOff) { $(btnOn).classList.add('on'); $(btnOff).classList.remove('on'); }
$('b2d').onclick = () => { an('b2d', 'b3d'); map.easeTo({ pitch: 0, bearing: 0, duration: 900 }); };
$('b3d').onclick = () => { an('b3d', 'b2d'); map.easeTo({ pitch: 58, bearing: -25, duration: 900 }); };
$('bl').onclick = () => map.easeTo({ bearing: map.getBearing() - 45, duration: 700 });
$('br').onclick = () => map.easeTo({ bearing: map.getBearing() + 45, duration: 700 });
$('bgKarte').onclick = () => { an('bgKarte', 'bgSat'); map.setLayoutProperty('karte', 'visibility', 'visible'); map.setLayoutProperty('sat', 'visibility', 'none'); };
$('bgSat').onclick = () => { an('bgSat', 'bgKarte'); map.setLayoutProperty('sat', 'visibility', 'visible'); map.setLayoutProperty('karte', 'visibility', 'none'); };
$('png').onclick = () => {
  const a = document.createElement('a');
  a.download = '3d-ansicht.png'; a.href = map.getCanvas().toDataURL('image/png'); a.click();
};
</script>
