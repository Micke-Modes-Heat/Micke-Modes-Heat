# Baut beide Einzeldateien und veröffentlicht sie auf GitHub Pages.
#   Hauptapp:  https://<owner>.github.io/<repo>/         (index.html)
#   Feldapp:   https://<owner>.github.io/<repo>/feldapp.html
#
# Pages zeigt immer den neuesten Stand von main ("latest").
# Eingefrorene, versionierte Stände kommen über die GitHub Releases (release.yml).
#
# Aktivierung (einmalig): Repository → Settings → Pages → Source: "GitHub Actions"

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'src/**'
      - 'build-singlefile.mjs'
      - 'field-app/**'
      - 'build-feldapp.mjs'
  workflow_dispatch:   # manuell auslösbar

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Hauptapp bauen (dist/index.html)
        run: npm run build

      - name: Feldapp bauen (dist/feldapp.html)
        run: npm run build:feldapp

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v4

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
