name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Lint zuerst: fängt fehlende Imports (no-undef) und Import-Zuweisungen
      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Browser-Smoke gegen den frisch gebauten Singlefile-Build
      - run: npm run build

      - run: npx playwright install chromium --with-deps

      - run: npm run test:e2e
