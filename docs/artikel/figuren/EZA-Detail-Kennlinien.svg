amily="Tahoma, Verdana, sans-serif" font-size="10" text-anchor="middle" fill="#5A5F5A">+0,33</text><text x="850" y="324" font-family="Tahoma, Verdana, sans-serif" font-size="10.5" text-anchor="middle" fill="#1B1F1C">Q / P_b,inst  (− untererregt · + übererregt)</text><text x="690" y="180" font-family="Tahoma, Verdana, sans-serif" font-size="10.5" text-anchor="middle" transform="rotate(-90 690 180)" fill="#1B1F1C">P / P_b,inst</text><polyline points="970.0,119.9 959.0,115.0 947.6,110.6 936.0,106.6 924.2,103.2 912.1,100.3 899.9,97.9 887.5,96.0 875.1,94.6 862.6,93.8 850.0,93.6 837.4,93.8 824.9,94.6 812.5,96.0 800.1,97.9 787.9,100.3 775.8,103.2 764.0,106.6 752.4,110.6 741.0,115.0 730.0,119.9" fill="none" stroke="#8A8F8A" stroke-width="1.4" stroke-dasharray="5 4" stroke-linejoin="round"/><polyline points="964.7,105.7 952.8,101.0 940.6,96.9 928.1,93.3 915.4,90.2 902.5,87.7 889.5,85.7 876.4,84.3 863.2,83.4 850.0,83.2 836.8,83.4 823.6,84.3 810.5,85.7 797.5,87.7 784.6,90.2 771.9,93.3 759.4,96.9 747.2,101.0 735.3,105.7" fill="none" stroke="#2A64B4" stroke-width="1.8" stroke-linejoin="round"/><circle cx="929.2" cy="93.57142857142858" r="4" fill="#2A64B4"/><text x="850" y="172.14285714285717" font-family="Tahoma, Verdana, sans-serif" font-size="10" text-anchor="middle" fill="#C8641E">geforderter</text><text x="850" y="185.14285714285717" font-family="Tahoma, Verdana, sans-serif" font-size="10" text-anchor="middle" fill="#C8641E">Bereich</text><text x="734.8" y="262.5" font-family="Tahoma, Verdana, sans-serif" font-size="9.5" fill="#5A5F5A">Teillast:</text><text x="734.8" y="274.5" font-family="Tahoma, Verdana, sans-serif" font-size="9.5" fill="#5A5F5A">nach NB</text><text x="734.8" y="75.89285714285714" font-family="Tahoma, Verdana, sans-serif" font-size="10" fill="#2A64B4">S = 1,05</text><text x="734.8" y="132.85714285714286" font-family="Tahoma, Verdana, sans-serif" font-size="10" fill="#8A8F8A">S = 1,00</text><text x="30" y="372" font-family="Tahoma, Verdana, sans-serif" font-size="10.5" fill="#8A8F8A">Prinzipdarstellung. Welche Kennlinie gilt, wo die Stützstellen liegen und welcher Blindleistungsbereich gefordert ist, legen VDE-AR-N 4110 und die TAB des Netzbetreibers fest.</text><text x="30" y="388" font-family="Tahoma, Verdana, sans-serif" font-size="10.5" fill="#8A8F8A">Q > 0: übererregt (Anlage gibt Blindleistung ab, Spannung steigt); Q &lt; 0: untererregt (Anlage nimmt Blindleistung auf, Spannung sinkt). Bezugswerte auf P_b,inst normiert.</text></svg>